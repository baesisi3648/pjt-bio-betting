<style>
/* 05-design-system.md — 외부 글꼴·CDN 없음. 학교망에서 막히면 수업이 멈춘다 */
:root{
  --bg:#0F1720; --bg-light:#F5F7FA; --card:#1B2734; --card-light:#FFF;
  --text:#E8EDF2; --text-dark:#1B2734; --muted:#7A8A99;
  --gold:#F2B441; --run:#4FC3F7; --goal:#EF5350; --ok:#66BB6A; --wait:#FFA726;
  --easy:#7CB342; --normal:#FB8C00; --hard:#E53935;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
     -webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none !important}

/* 연결 경고 */
#conn{position:fixed;top:0;left:0;right:0;background:var(--goal);color:#fff;
      padding:10px;text-align:center;font-weight:700;z-index:99}

/* 확인 대화 — alert/confirm은 폴링을 막으므로 쓰지 않는다 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
       align-items:center;justify-content:center;z-index:100;padding:20px}
#modal .box{background:#fff;color:var(--text-dark);border-radius:14px;padding:24px;max-width:420px;width:100%}
#modal p{font-size:17px;line-height:1.6;margin-bottom:20px;white-space:pre-line}
#modal .btns{display:flex;gap:10px}
#modal button{flex:1;padding:14px;font-size:16px;font-weight:700}
#modal .yes{background:var(--gold);color:#1B2734}
#modal .no{background:#E3E8EE;color:#48606F}
.ver{color:var(--muted);font-size:12px;text-align:center;padding:8px}

/* 움직임을 불편해하는 학생·교사를 위해. 연출은 거들 뿐이라 꺼져도 게임은 그대로 돌아간다 */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>

<div id="conn" class="hidden">연결이 불안정해요. 인터넷을 확인해주세요</div>
<div id="modal" class="hidden"><div class="box">
  <p id="modal-msg"></p>
  <div class="btns"><button class="no" id="modal-no">취소</button><button class="yes" id="modal-yes">확인</button></div>
</div></div>

<script>
/* ── 확인 대화 ── */
var _onYes = null;
function confirmBox(msg, onYes){
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal').classList.remove('hidden');
  _onYes = onYes;
}
document.getElementById('modal-yes').onclick = function(){
  document.getElementById('modal').classList.add('hidden');
  if(_onYes){ var f=_onYes; _onYes=null; f(); }
};
document.getElementById('modal-no').onclick = function(){
  document.getElementById('modal').classList.add('hidden'); _onYes=null;
};

/* ── 서버 호출 — 두 번 누르기 방지 ── */
var busy = {};
function call(fn, args, done, onError){
  if(busy[fn]) return;
  busy[fn] = true;
  google.script.run
    .withSuccessHandler(function(res){ busy[fn]=false; handle(res, done, onError); })
    .withFailureHandler(function(e){
      busy[fn]=false;
      // 조용히 실패하면 화면이 그냥 비어 있어서 원인을 알 수 없다
      var msg = (e && e.message) ? e.message : '서버 응답이 없어요';
      toast(msg);
      if(onError) onError(msg); else onFail(e);
    })
    [fn].apply(null, args||[]);
}
/**
 * 서버가 던진 오류와, 서버가 정상적으로 돌려준 거절({ok:false})은 다른 길로 온다.
 * 부르는 쪽이 신경 쓸 일이 아니므로 onError 는 둘 다 받는다 —
 * 안 그러면 "열쇠가 틀렸다" 같은 거절에 화면이 아무 반응도 못 한다.
 */
function handle(res, done, onError){
  if(!res || !res.ok){
    var msg = res && res.message;
    if(msg) toast(msg);
    if(onError) onError(msg, res);
    return;
  }
  hideConn();
  if(done) done(res.data);
}

/* ── 폴링 — stateVersion이 바뀔 때만 다시 그린다 ── */
var lastVersion = -1, failCount = 0, pollTimer = null;

/* 다시 눌러도 소용없는 실패들. 2초마다 조용히 재시도하면 원인을 영영 모른다 */
var FATAL = { NOT_HOST: 1, WRONG_PIN: 1, GAME_NOT_FOUND: 1, GAME_ENDED: 1 };

function startPolling(fn, args, render, tick){
  function poll(){
    google.script.run
      .withSuccessHandler(function(res){
        if(!res || !res.ok){ onFail(res); return; }
        failCount = 0; hideConn();
        var d = res.data;
        if(d.stateVersion !== lastVersion){ lastVersion = d.stateVersion; render(d); }
        if(tick) tick(d);
      })
      .withFailureHandler(function(){ onFail(); })
      [fn].apply(null, args());
  }
  poll();
  pollTimer = setInterval(poll, 2000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

function onFail(res){
  if(res && res.error && FATAL[res.error]){
    // 재시도가 답이 아니다 — 멈추고 이유를 띄운다
    stopPolling();
    var c = document.getElementById('conn');
    c.textContent = res.message || '이 판을 볼 수 없어요';
    c.classList.remove('hidden');
    return;
  }
  if(++failCount >= 3) document.getElementById('conn').classList.remove('hidden');
}
function hideConn(){ document.getElementById('conn').classList.add('hidden'); }
function forceRefresh(){ lastVersion = -1; }

/* ── 표시 ── */
function toast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.add('hidden'); }, 3500);
}
/* 진동 — 안드로이드 크롬만 듣는다. iOS는 조용히 무시되므로 분기하지 않는다 */
function buzz(pattern){
  try { if(navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function mmss(s){ return s==null ? '' : s + '초'; }
</script>
