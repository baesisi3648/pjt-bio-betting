version: "2.0"

screen:
  id: S1
  name: 선생님 — 시작 화면
  route: "?role=teacher"
  viewer: teacher
  layout: single-column-centered
  musts: [M1, M4, M5]

data_requirements:
  - resource: question
    needs: [unit, level]
    purpose: 단원 목록 뽑기 + 난이도별 문항 수 세기
  - resource: animal
    needs: [code, name, emoji]
    purpose: 8행 검증
  - resource: hint_template
    needs: [level, kind, template]
    purpose: 자리표시 깨짐 검증
  - resource: setting
    needs: [initial_coins, quiz_seconds, bet_seconds, seed_coins]
  - resource: game
    needs: [code, class_name, unit, round, is_over]
    purpose: 이어하기 목록

components:
  - id: tab_switch
    type: tabs
    function: "새 판 만들기 / 판 코드로 이어하기"

  - id: create_form
    type: form
    tab: 새 판 만들기
    fields:
      - { id: class_name, type: text, label: 반 이름, placeholder: "2학년 3반", required: true }
      - { id: unit, type: select, label: 단원, source: "question.unit (중복 제거)", required: true }
      - { id: team_count, type: number, label: 모둠 수, range: [2, 8], default: 6 }
      - { id: team_names, type: text_list, label: 모둠 이름, count_from: team_count,
          note: "비우면 '1모둠','2모둠'… 자동. 중복이면 뒤에 번호 붙임" }
    submit: { label: 판 만들기, action: createGame }

  - id: resume_form
    type: form
    tab: 판 코드로 이어하기
    fields:
      - { id: code, type: text, length: 4, label: 판 코드, transform: uppercase }
    submit: { label: 이어하기, action: loadGame }

  - id: recent_games
    type: list
    tab: 판 코드로 이어하기
    data_source: { resource: game, sort: created_at desc, limit: 10 }
    row: "{class_name} · {unit} · {round}라운드까지 · {is_over ? '끝남' : '진행중'}"
    empty: "아직 만든 판이 없어요. 새 판을 만들어 보세요."

  - id: handout_panel
    type: panel
    visible_when: 판 생성 직후
    function: 칠판·모둠장에게 전달할 정보. 이 화면이 S1의 실제 목적
    contents:
      - { id: game_code, style: "가장 큼 (96px)", value: "{code}" }
      - { id: student_url, type: text_and_qr, value: 학생용 웹앱 주소 }
      - { id: team_pins, type: table, columns: [모둠 번호, 모둠 이름, 암호 4자리],
          note: "모둠장에게만 종이로 전달. 화면을 TV에 띄운 채 두지 말 것" }
    actions:
      - { label: 인쇄하기, action: window.print, note: "인쇄용 CSS — 암호표를 모둠별로 잘라 쓸 수 있게 점선" }
      - { label: 진행 화면으로, action: goto S2 }

validations:
  blocking:   # 시작 자체를 막는다
    - id: animal_count
      rule: animal 행이 정확히 8개
      message: "'동물' 탭이 {n}줄이에요. 정확히 8줄이어야 합니다."
    - id: hint_placeholder
      rule: hint_template.template의 자리표시가 온전함
      message: "'힌트문구' 탭 {row}번째 줄에서 {X} 같은 자리표시가 지워졌어요."
    - id: unit_has_questions
      rule: 선택한 단원에 문항 1개 이상
      message: "'{unit}' 단원에 문제가 하나도 없어요."

  warning:    # 확인 후 계속 가능
    - id: question_shortage
      rule: 단원의 난이도별 문항이 6개 미만
      message: "'{unit}' 단원 — {level} {have}/6문항. 모자라면 앞 라운드 문제를 다시 냅니다. 그래도 시작할까요?"
      choices: [계속, 취소]

events:
  - on: createGame 성공
    then:
      - 서버가 정답 순위 확정 + 이동 역산 + 힌트 생성·검산 (M2, M3)
      - 판 코드 4자리 발급 (혼동 문자 제외: 0 O 1 I)
      - 모둠별 암호 4자리 발급
      - handout_panel 표시
  - on: loadGame 성공
    then: S2로 이동, 마지막 라운드 시작 시점 상태 복원

tests:
  - name: 정상 판 생성
    when: 반 이름·단원·모둠 6개 입력 후 판 만들기
    then: [판 코드 4자리 표시, 모둠 6개 암호 표시, 학생 주소 QR 표시]
  - name: 문항 부족 경고
    when: 어려움 2문항뿐인 단원 선택
    then: ["'어려움 2/6문항' 경고 표시", 계속 선택 시 판 생성됨]
  - name: 동물 탭 깨짐
    when: 동물 탭이 7줄인 상태로 판 만들기
    then: [시작 차단, 몇 줄인지 안내]
  - name: 이어하기
    when: 지난 판 코드 입력
    then: [S2로 이동, 코인·힌트·트랙 위치가 지난 시간 그대로]
  - name: 이어하기 목록 비었을 때
    when: 판이 하나도 없는 상태로 이어하기 탭
    then: ["'아직 만든 판이 없어요' 안내"]

notes:
  - 판 코드는 혼동되는 글자(0 O 1 I)를 뺀다. 칠판에 적어 30명이 폰에 입력한다
  - 암호표를 화면에 띄운 채 TV로 넘어가면 안 된다 — S2 이동 시 자동으로 닫는다
